<!doctype html>
<meta charset="utf-8">
<title>TP5-WASM</title>
<style>body { background: #222; color: #ccc; font: 14px sans-serif; margin: 1em; }</style>
<p id="message">Starting the IDE...</p>
<script type="module">
// Registers the service worker (coi-sw.js) that adds COOP/COEP, waits until it is active, and
// opens the IDE page, whose navigation the worker then answers with the headers. Paths are
// relative so the site works under a sub-path such as /tpc/.
const message = document.getElementById("message");

// Gives a first-time visitor a program to open (F3, then DEMO). Only into empty storage, so
// a visitor's own files are never replaced.
async function seedDemoProgram() {
  try {
    const hasFiles = Object.keys(localStorage).some((key) => key.startsWith("tp5:"));
    if (!hasFiles) localStorage.setItem("tp5:DEMO.PAS", await (await fetch("demo.pas")).text());
  } catch (error) {
    // Storage may be blocked; the IDE then starts empty.
  }
}

async function start() {
  if (!("serviceWorker" in navigator)) {
    message.textContent = "This page needs service workers (a secure context, https).";
    return;
  }
  await navigator.serviceWorker.register("coi-sw.js");
  await navigator.serviceWorker.ready;
  await seedDemoProgram();
  location.replace("host/index.html?wasm=../ide.wasm&compiler=../tp5c.wasm");
}
start().catch((error) => { message.textContent = `Cannot start: ${error}`; });
</script>
